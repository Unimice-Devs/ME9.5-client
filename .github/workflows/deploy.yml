name: Build and Deploy Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server via rsync
      uses: burnett01/rsync-deployments@7.0.1
      with:
        switches: -rlvz --delete --no-perms --omit-dir-times --exclude=".*" --exclude "blank" --exclude 'minecraft.jar' --exclude 'libraries/' --exclude 'natives/'
        path: ./
        remote_path: "/home/shion/gravitlauncher/launcher/updates/Mouse-Earth/"
        remote_host: ${{ secrets.UNIMICE_SSH_HOST }}
        remote_user: ${{ secrets.UNIMICE_SSH_USER }}
        remote_key: ${{ secrets.UNIMICE_SSH_PRIVATE_KEY }}
        remote_port: ${{ secrets.UNIMICE_SSH_PORT }}

    - name: Sync GravitLauncher profiles
      env:
        SYNC_KEY: ${{ secrets.UNIMICE_SSH_SYNC_KEY }}
        HOST: ${{ secrets.UNIMICE_SSH_HOST }}
        PORT: ${{ secrets.UNIMICE_SSH_PORT }}
        USER_NAME: ${{ secrets.UNIMICE_SSH_USER }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SYNC_KEY" > ~/.ssh/sync_key
        chmod 600 ~/.ssh/sync_key
        ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST"